name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Install API 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR/licenses"
          grep -qxF "24333f8a63b6825ea9c5514f83c2829b004d1fee" "$SDK_DIR/licenses/android-sdk-license" 2>/dev/null || echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$SDK_DIR/licenses/android-sdk-license"
          grep -qxF "84831b9409646a918e30573bab4c9c91346d8abd" "$SDK_DIR/licenses/android-sdk-preview-license" 2>/dev/null || echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK_DIR/licenses/android-sdk-preview-license"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Using sdkmanager: $SDKMANAGER in $SDK_DIR"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0"
          else
            echo "Warning: sdkmanager not found; relying on Gradle auto-download"
          fi

      - name: Restore and verify original debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ] || [ -z "$DEBUG_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing keystore secrets"
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
          keytool -list -v -keystore debug.keystore -storepass "$DEBUG_KEYSTORE_PASSWORD" > /tmp/keystore-info.txt
          ACTUAL_SHA1="$(awk -F': ' '/SHA1:/{print toupper($2); exit}' /tmp/keystore-info.txt)"
          EXPECTED_SHA1="71:15:37:41:1F:7C:E2:DD:07:50:81:4C:33:C4:BF:70:3E:CF:CB:32"
          echo "Debug keystore SHA-1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::SHA-1 mismatch"
            exit 1
          fi
          echo "Original debug keystore verified."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -s app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret"
            elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret"
            else
              echo "::warning::app/google-services.json is missing! Add GOOGLE_SERVICES_JSON in GitHub Repository Secrets or generate APK directly from AI Studio."
            fi
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvaPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
